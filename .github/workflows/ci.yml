name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install uv
        run: pip install uv
      - name: Install dependencies
        run: |
          uv venv .venv
          uv pip install --python .venv/bin/python -r requirements-dev.txt
      - name: Install Playwright Chromium (browser-agent unit tests launch it)
        # ~14 unit tests drive a real Chromium; the pip `playwright` package
        # ships no browser binary, so without this the first CI run goes red.
        # --with-deps pulls the OS libraries Chromium needs on the runner.
        run: .venv/bin/python -m playwright install --with-deps chromium
      - name: Design system — contrast, palette drift, portal (docs/16 §2.4, §12)
        run: .venv/bin/python scripts/check_contrast.py

      - name: Design system — icon sprite is up to date
        run: |
          .venv/bin/python scripts/build_icons.py
          git diff --exit-code app/static/index.html \
            || (echo "sprite is stale — run scripts/build_icons.py and commit"; exit 1)

      - name: Security hygiene — no env files or local secrets tracked (docs/12)
        run: |
          if git ls-files | grep -xE '\.env|\.env\.prod|\.portal_secrets\.json|sessions\.db'; then
            echo "a local secret file is tracked in git"; exit 1
          fi

      - name: Unit + service + integration tests
        run: .venv/bin/python -m pytest tests/unit tests/integration -q
      - name: Python static checks
        run: .venv/bin/ruff check .
      - name: ADK golden evals (needs GCP creds)
        env:
          GCP_CREDENTIALS: ${{ secrets.GCP_CREDENTIALS }}
        run: |
          # Required acceptance gate: a green CI run means evals actually ran.
          if [ -z "$GCP_CREDENTIALS" ]; then
            echo "::error title=ADK eval gate blocked::GCP_CREDENTIALS must be configured for CI."
            {
              echo "### ❌ ADK golden eval gate could not run"
              echo ""
              echo "Configure the \`GCP_CREDENTIALS\` repository secret; CI cannot pass without the required golden evaluations."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          printf '%s' "$GCP_CREDENTIALS" > /tmp/gcp-key.json
          export GOOGLE_APPLICATION_CREDENTIALS=/tmp/gcp-key.json
          for set in tests/eval/evalsets/*.json; do
            PYTHONPATH=. .venv/bin/adk eval agents/co_founder "$set" \
              --config_file_path tests/eval/eval_config.json || exit 1
          done
