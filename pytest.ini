[pytest]
testpaths = tests
asyncio_mode = auto
# Several test modules apply a module-wide asyncio mark that also lands on
# their sync tests; with asyncio_mode=auto the mark is redundant and the
# per-test warning is pure noise. Everything else still surfaces.
filterwarnings =
    ignore:The test .* is marked with '@pytest\.mark\.asyncio' but it is not an async function
