<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in — Co-Founder</title>
<style>
/* Compact cut of the Workbench tokens (docs/16). This page has no build step
   and must render before any auth exists, so it carries its own styles. */
:root {
  color-scheme: dark;
  --surface-0: #090B10; --surface-1: #12151D; --surface-2: #191D27;
  --border: #353A4A; --divider: #262B38; --field: #5D6475;
  --ink-1: #E9ECF4; --ink-2: #A6AEC2; --ink-3: #7C8599;
  --accent: #6E9BFF; --accent-ink: #6E9BFF; --accent-on: #0A1020;
  --danger: #FF6B61; --danger-ink: #FF8F87; --danger-bg: rgba(255,107,97,.15);
  --ok-ink: #5FDC93; --ok-bg: rgba(67,208,124,.15);
  --accent-bg: rgba(110,155,255,.14);
  --e-3: 0 24px 60px rgba(0,0,0,.6);
  --font-ui: ui-sans-serif, -apple-system, BlinkMacSystemFont, "SF Pro Text",
             "Segoe UI Variable Text", "Segoe UI", Inter, Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-display: "SF Pro Display", ui-sans-serif, -apple-system, BlinkMacSystemFont,
             "Segoe UI Variable Display", "Segoe UI", Inter, Roboto, sans-serif;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    color-scheme: light;
    --surface-0: #EFF2F7; --surface-1: #FFFFFF; --surface-2: #F5F7FC;
    --border: #C9D0DE; --divider: #E4E8F1; --field: #8D94A3;
    --ink-1: #161B26; --ink-2: #4E5769; --ink-3: #646D80;
    --accent: #2F5BD0; --accent-ink: #2F5BD0; --accent-on: #FFFFFF;
    --danger: #CE4136; --danger-ink: #B8271C; --danger-bg: rgba(206,65,54,.12);
    --ok-ink: #0B7A41; --ok-bg: rgba(18,146,78,.13);
    --accent-bg: rgba(47,91,208,.12);
    --e-3: 0 24px 60px rgba(22,30,54,.20);
  }
}
*, *::before, *::after { box-sizing: border-box; }
body {
  margin: 0; min-height: 100dvh; display: grid; place-items: center;
  background: var(--surface-0); color: var(--ink-1);
  font: 400 14px/22px var(--font-ui);
  -webkit-font-smoothing: antialiased;
}
.card {
  width: min(400px, calc(100vw - 32px));
  background: var(--surface-1); border: 1px solid var(--border);
  border-radius: 20px; box-shadow: var(--e-3);
  padding: 32px 28px; display: flex; flex-direction: column; gap: 14px;
}
.brand { font: 700 18px/1 var(--font-display); letter-spacing: -.015em; }
.brand span { color: var(--accent-ink); }
.sub { color: var(--ink-3); font-size: 13px; line-height: 20px; margin-bottom: 6px; }
label { font: 600 12px/18px var(--font-ui); color: var(--ink-2); display: block; margin-bottom: 4px; }
input {
  width: 100%; background: var(--surface-2); color: var(--ink-1);
  border: 1px solid var(--border); border-radius: 10px;
  padding: 10px 12px; font: 400 14px/20px var(--font-ui);
}
input::placeholder { color: var(--ink-3); }
input:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px var(--accent-bg); }
button {
  display: flex; align-items: center; justify-content: center; gap: 8px;
  width: 100%; height: 40px; border: 1px solid transparent; border-radius: 10px;
  font: 500 14px/1 var(--font-ui); cursor: pointer;
  background: var(--accent); color: var(--accent-on);
}
button:hover { filter: brightness(1.08); }
button:disabled { opacity: .5; cursor: not-allowed; }
button.secondary { background: var(--surface-2); border-color: var(--border); color: var(--ink-1); }
.gmark { width: 18px; height: 18px; flex: none; }
.split { display: flex; align-items: center; gap: 10px; color: var(--ink-3); font-size: 12px; }
.split::before, .split::after { content: ""; flex: 1; height: 1px; background: var(--divider); }
.note { font-size: 12px; line-height: 18px; color: var(--ink-3); }
.note a, .links a { color: var(--accent-ink); cursor: pointer; text-underline-offset: 2px; }
.links { display: flex; justify-content: space-between; font-size: 12px; }
.msg { border-radius: 10px; padding: 10px 12px; font-size: 13px; line-height: 19px; display: none; }
.msg[data-tone="danger"] { display: block; background: var(--danger-bg); color: var(--danger-ink); }
.msg[data-tone="ok"] { display: block; background: var(--ok-bg); color: var(--ok-ink); }
</style>
</head>
<body>

<div class="card" id="card">
  <div class="brand">Co-<span>Founder</span></div>
  <div class="sub" id="tagline">Sign in to your workspace.</div>
  <div class="msg" id="msg" role="status"></div>

  <form id="emailForm" style="display:contents" onsubmit="return false">
    <div>
      <label for="email">Email</label>
      <input id="email" type="email" autocomplete="email" placeholder="you@company.com" required>
    </div>
    <div>
      <label for="password">Password</label>
      <input id="password" type="password" autocomplete="current-password" placeholder="••••••••" required>
    </div>
    <button id="signinBtn" type="submit">Sign in</button>
    <div class="links">
      <a id="createLink">Create an account</a>
      <a id="resetLink">Forgot password?</a>
    </div>
  </form>

  <div class="split" id="split">or</div>
  <button class="secondary" id="googleBtn" type="button">
    <!-- Official Google "G" — sign-in buttons are the sanctioned use of this
         mark (Google Identity branding guidelines); colors never re-themed. -->
    <svg class="gmark" viewBox="0 0 48 48" aria-hidden="true">
      <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
      <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
      <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
      <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
    </svg>
    <span id="googleLabel">Continue with Google</span></button>
  <div class="note">Access is limited to emails authorized for this workspace.
    Your co-founder never sees your password.</div>
</div>

<script type="module">
const $ = id => document.getElementById(id);
const show = (text, tone) => { const m = $("msg"); m.textContent = text; m.dataset.tone = tone; };
const clear = () => { $("msg").removeAttribute("data-tone"); };
const busy = (on) => ["signinBtn", "googleBtn"].forEach(id => $(id).disabled = on);

const GOOGLE_LABEL = "Continue with Google";
const googleLabel = text => { $("googleLabel").textContent = text; };

// Match the app's stored theme choice so the two pages never disagree.
const stored = localStorage.getItem("cofounder-theme");
if (stored) document.documentElement.dataset.theme = stored;
else delete document.documentElement.dataset.theme;

const cfg = await fetch("/auth/config").then(r => r.json()).catch(() => null);

// Already signed in (or dev-open)? Straight to the app.
const me = await fetch("/auth/me").then(r => r.ok ? r.json() : null).catch(() => null);
if (me?.authenticated) {
  location.replace("/");
} else if (!cfg || !cfg.enabled) {
  $("tagline").textContent = "Sign-in isn't configured for this deployment.";
  show("Set FIREBASE_WEB_API_KEY, FIREBASE_PROJECT_ID and ALLOWED_LOGIN_EMAILS "
     + "to enable email + Google sign-in — or open the app with your access key "
     + "(/?key=…).", "danger");
  for (const id of ["emailForm", "googleBtn"]) $(id).style.display = "none";
} else {
  const firebaseEnabled = Boolean(cfg.firebaseEnabled);
  const googleEnabled = Boolean(cfg.googleEnabled);
  const googleErrors = {
    not_configured: "Google sign-in isn't configured for this deployment.",
    start_failed: "Google sign-in couldn't start — check the deployment configuration.",
    invalid_state: "That sign-in attempt expired or was already used — try again.",
    cancelled: "Google sign-in was cancelled.",
    exchange_failed: "Google couldn't complete sign-in — try again.",
    unverified_email: "Google did not return a verified email address.",
    not_authorized: "That Google account isn't authorized for this workspace.",
  };
  const errorCode = new URL(location.href).searchParams.get("google_error");
  if (errorCode) {
    show(googleErrors[errorCode] || "Google sign-in failed — try again.", "danger");
    history.replaceState({}, "", "/login.html");
  }

  if (!firebaseEnabled) $("emailForm").style.display = "none";
  if (!googleEnabled) $("googleBtn").style.display = "none";
  if (!firebaseEnabled || !googleEnabled) $("split").style.display = "none";

  // Google login uses a confidential server-side authorization-code flow.
  // The browser only follows current-tab redirects; no popup API or
  // cross-origin Firebase storage participates in the result hand-off.
  if (googleEnabled) {
    $("googleBtn").onclick = () => {
      clear(); busy(true); googleLabel("Redirecting to Google…");
      location.assign("/auth/google/start");
    };
  }

  if (firebaseEnabled) {
    const { initializeApp } = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js");
    const { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword,
            sendEmailVerification, sendPasswordResetEmail, signOut } =
      await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js");

    const auth = getAuth(initializeApp({
      apiKey: cfg.apiKey, authDomain: cfg.authDomain, projectId: cfg.projectId }));

    async function establishSession(user) {
      const idToken = await user.getIdToken();
      const r = await fetch("/auth/session", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ id_token: idToken }) });
      if (r.ok) { location.replace("/"); return; }
      const j = await r.json().catch(() => ({}));
      await signOut(auth);
      show(j.error || "Sign-in was rejected.", "danger");
    }

    const FRIENDLY = {
      "auth/invalid-credential": "Wrong email or password.",
      "auth/wrong-password": "Wrong email or password.",
      "auth/user-not-found": "No account with that email — create one below.",
      "auth/too-many-requests": "Too many attempts — wait a minute, or reset your password.",
      "auth/email-already-in-use": "That email already has an account — sign in instead.",
      "auth/weak-password": "Password must be at least 6 characters.",
      "auth/invalid-email": "That doesn't look like an email address.",
      "auth/network-request-failed": "Couldn't reach Firebase — check your connection and try again.",
    };
    const friendly = e => FRIENDLY[e && e.code] || (e && e.message) || String(e);

    $("emailForm").addEventListener("submit", async () => {
      clear(); busy(true);
      try {
        const cred = await signInWithEmailAndPassword(auth, $("email").value.trim(), $("password").value);
        if (!cred.user.emailVerified) {
          await sendEmailVerification(cred.user).catch(() => {});
          await signOut(auth);
          show("Verify your email first — a fresh verification link is on its way to your inbox.", "ok");
          return;
        }
        await establishSession(cred.user);
      } catch (e) { show(friendly(e), "danger"); }
      busy(false);
    });

    $("createLink").onclick = async () => {
      clear();
      const email = $("email").value.trim(), password = $("password").value;
      if (!email || !password) { show("Enter the email and a password to create the account with.", "danger"); return; }
      busy(true);
      try {
        const cred = await createUserWithEmailAndPassword(auth, email, password);
        await sendEmailVerification(cred.user).catch(() => {});
        await signOut(auth);
        show("Account created. Click the verification link in your inbox, then sign in here.", "ok");
      } catch (e) { show(friendly(e), "danger"); }
      busy(false);
    };

    $("resetLink").onclick = async () => {
      clear();
      const email = $("email").value.trim();
      if (!email) { show("Enter your email above first, then click reset.", "danger"); return; }
      try {
        await sendPasswordResetEmail(auth, email);
        show("Password reset email sent — check your inbox.", "ok");
      } catch (e) { show(friendly(e), "danger"); }
    };
  }
}
</script>
</body>
</html>
