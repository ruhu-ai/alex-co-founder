<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Apply · Co-Founder</title>
<style>
:root{color-scheme:dark;--bg:#090b10;--surface:#12151d;--surface2:#191d27;--border:#353a4a;--ink:#e9ecf4;--muted:#a6aec2;--accent:#6e9bff;--ok:#43d07c;--danger:#ff6b61;font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);line-height:1.55}.top{border-bottom:1px solid var(--border);padding:18px max(20px,calc((100% - 920px)/2))}.top a{color:var(--muted);text-decoration:none}.page{max-width:920px;margin:auto;padding:32px 20px 72px}.card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:22px;margin:18px 0}.eyebrow{color:var(--accent);font-size:12px;text-transform:uppercase;letter-spacing:.08em}.muted{color:var(--muted)}h1{font-size:clamp(30px,5vw,48px);line-height:1.1;margin:.3em 0}h2{margin-top:0}.meta{display:flex;flex-wrap:wrap;gap:8px}.meta span{background:var(--surface2);padding:5px 9px;border-radius:99px;font-size:13px}label{display:block;margin:14px 0 5px}input,textarea{width:100%;background:var(--surface2);color:var(--ink);border:1px solid var(--border);border-radius:6px;padding:11px;font:inherit}textarea{min-height:120px;resize:vertical}input[type=file]{padding:10px}input[type=checkbox]{width:auto;margin-right:8px}.check{display:flex;align-items:flex-start}.trap{position:absolute;left:-10000px;width:1px;height:1px;overflow:hidden}button{background:var(--accent);color:#07101f;border:0;border-radius:6px;padding:11px 18px;font:600 15px inherit;cursor:pointer}button:disabled{opacity:.55;cursor:wait}.error{color:var(--danger)}.success{color:var(--ok)}.description{white-space:pre-wrap}.criteria li{margin:10px 0}@media(max-width:600px){.page{padding-top:20px}.card{padding:17px}}
</style>
</head>
<body>
<header class="top"><a href="/">Co-Founder</a></header>
<main class="page">
  <section id="role"><p class="muted">Loading this role…</p></section>
  <section class="card" id="applyCard" hidden>
    <h2>Apply for this role</h2>
    <p class="muted">Your application is attached only to this role. Alex prepares an evidence summary; a human makes every hiring decision.</p>
    <form id="applicationForm">
      <label for="name">Full name</label><input id="name" name="name" autocomplete="name" maxlength="160" required>
      <label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email" maxlength="254" required>
      <label for="phone">Phone (optional)</label><input id="phone" name="phone" autocomplete="tel" maxlength="80">
      <label for="resume">Resume</label><input id="resume" name="resume" type="file" accept=".pdf,.docx,.txt" required><p class="muted">PDF, DOCX, or UTF-8 TXT; 10 MB maximum.</p>
      <label for="cover_note">Note (optional)</label><textarea id="cover_note" name="cover_note" maxlength="4000" placeholder="Share evidence relevant to the role criteria."></textarea>
      <div class="trap" aria-hidden="true"><label for="website">Website</label><input id="website" name="website" tabindex="-1" autocomplete="off"></div>
      <label class="check"><input id="notice_accepted" name="notice_accepted" type="checkbox" value="true" required><span>I have read the <a id="noticeLink" href="/hiring-notice.html">candidate privacy notice</a> and ask the hiring company to process this role-scoped application.</span></label>
      <input type="hidden" id="application_token" name="application_token">
      <input type="hidden" id="client_request_id" name="client_request_id">
      <button id="submit" type="submit">Submit application</button>
      <p id="status" role="status" aria-live="polite"></p>
    </form>
  </section>
</main>
<script>
const esc=value=>String(value??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
const slug=location.pathname.split('/').filter(Boolean).at(-1)||'';
let publicRole=null;
async function load(){const host=document.querySelector('#role');try{const response=await fetch(`/api/public/hiring/roles/${encodeURIComponent(slug)}`,{headers:{Accept:'application/json'}}),json=await response.json();if(!response.ok)throw new Error('This role is unavailable or no longer accepting applications.');publicRole=json;const r=json.role;document.title=`${r.role_title} · ${r.company_name}`;host.innerHTML=`<p class="eyebrow">${esc(r.company_name)} · ${esc(r.role_code)}</p><h1>${esc(r.role_title)}</h1><p class="muted">${esc(r.role_summary)}</p><div class="meta">${(r.location_envelope||[]).map(x=>`<span>${esc(x)}</span>`).join('')}<span>${esc(r.compensation_envelope)}</span></div><section class="card"><h2>About the role</h2><div class="description">${esc(r.public_job_description)}</div></section><section class="card criteria"><h2>What we will assess</h2><ul>${(r.criteria||[]).map(c=>`<li><strong>${esc(c.label)}</strong><br><span class="muted">${esc(c.description)}</span></li>`).join('')}</ul></section>`;document.querySelector('#noticeLink').href=r.notice_path;if(json.applications_enabled){document.querySelector('#application_token').value=json.application_token;document.querySelector('#client_request_id').value=`public_apply_${crypto.randomUUID().replaceAll('-','_')}`;document.querySelector('#applyCard').hidden=false}else{host.insertAdjacentHTML('beforeend','<p class="card muted">Applications are not currently open for this role.</p>')}}catch(error){host.innerHTML=`<div class="card error">${esc(error.message)}</div>`}}
document.querySelector('#applicationForm').addEventListener('submit',async event=>{event.preventDefault();const button=document.querySelector('#submit'),status=document.querySelector('#status');button.disabled=true;status.className='';status.textContent='Submitting securely…';try{const response=await fetch(`/api/public/hiring/roles/${encodeURIComponent(slug)}/applications`,{method:'POST',body:new FormData(event.currentTarget)}),json=await response.json();if(!response.ok||json.error)throw new Error(json.message||'Application could not be submitted.');status.className='success';status.textContent=`Application received${json.application_reference?` · reference ${json.application_reference}`:''}. A human will review it.`;event.currentTarget.querySelectorAll('input:not([type=hidden]),textarea').forEach(input=>{if(input.type==='checkbox')input.checked=false;else input.value=''})}catch(error){status.className='error';status.textContent=error.message;button.disabled=false}});
load();
</script>
</body>
</html>
